# vim: set filetype=tmux:
# bindings.conf — machine-local tmux command aliases
# Copy to ~/.tmux/local/bindings.conf and edit for your machine.
#
# Each alias lets you load a window config from the tmux command prompt
# with :alias-name (prefix + :).
#
# Aliases are indexed; use non-overlapping integers. Indices 0–9 are
# reserved by the main tmux.conf. Start local aliases at 100 or higher.
#
# Format:
#   set -s command-alias[<index>] <name>='source-file ~/.tmux/local/<name>'
#
# After editing, reload with: tmux source ~/.tmux.conf
# Or regenerate from windows.yaml with: dev-windows generate

# Session aliases (load full multi-window sessions)
set -s command-alias[110] my-session='source-file ~/.tmux/local/sessions/my-session'

# Window aliases (load individual project windows)
set -s command-alias[120] my-project='source-file ~/.tmux/local/my-project'
set -s command-alias[121] my-service='source-file ~/.tmux/local/my-service'
set -s command-alias[122] my-docs='source-file ~/.tmux/local/my-docs'
set -s command-alias[123] my-platform='source-file ~/.tmux/local/my-platform'
set -s command-alias[124] my-notebooks='source-file ~/.tmux/local/my-notebooks'
